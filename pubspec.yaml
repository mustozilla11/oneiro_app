name: oneiro_app
description: "Oneiro - Derin mistik atmosfere ve modern mimariye sahip Rüya Tabiri mobil uygulaması."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Networking & API
  dio: ^5.4.3+1

  # Fonts & UI Styling
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1

  # Monetization (Google Mobile Ads)
  google_mobile_ads: ^5.1.0

  # Utilities & Helpers
  uuid: ^4.4.0
  intl: ^0.19.0
  share_plus: ^9.0.0
  shared_preferences: ^2.2.3

  # Firebase & Authentication
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0

  # In-App Purchases & Subscriptions (RevenueCat)
  purchases_flutter: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
